<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Niche Finder</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Niche Finder</h1>
            <p style="color: #8b949e;">Explorar nichos e influenciadores no Instagram</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Digite um nicho (ex: fitness, IA, moda)...">
            <button id="searchBtn">Buscar</button>
            <button id="searchListBtn" style="background: #30363d; border: 1px solid var(--glass-border);">Buscar da Lista</button>
        </div>

        <div id="loader" class="loader">
            <p>Buscando no Instagram (isso pode levar uns segundos)...</p>
        </div>

        <div id="results" class="results-grid">
            <!-- Cards will appear here -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
